name: CI & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Build & System Flows Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Push Database Schema
        run: npm run db:push
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Verify System Flows & Integrations
        run: npx tsx scripts/verify-system-flows.ts
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Build Next.js App
        run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          AUTH_SECRET: "ci-test-auth-secret-key-32chars-long"
          NEXT_TELEMETRY_DISABLED: 1
